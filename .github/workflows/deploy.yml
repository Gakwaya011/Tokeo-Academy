name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install backend dependencies
        run: cd backend && npm install
      
      - name: Type check backend
        run: cd backend && npx tsc --noEmit
      
      - name: Install frontend dependencies
        run: cd frontend && npm install
      
      - name: Type check frontend
        run: cd frontend && npx tsc -b --noEmit
      
      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            
            echo "--- Pulling latest code ---"
            cd /var/www/tokeo-academy
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- Building backend ---"
            cd backend
            npm install --production=false
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            
            echo "--- Restarting backend with rollback protection ---"
            pm2 reload tokeo-backend --update-env || {
              echo "!!! Reload failed, rolling back ---"
              git reset --hard HEAD~1
              npm run build
              pm2 reload tokeo-backend --update-env
              exit 1
            }
            pm2 save
            
            echo "--- Verifying backend is healthy ---"
            sleep 5
            pm2 show tokeo-backend | grep -q "online" || {
              echo "!!! Backend crashed, rolling back ---"
              cd /var/www/tokeo-academy
              git reset --hard HEAD~1
              cd backend
              npm run build
              pm2 reload tokeo-backend --update-env
              exit 1
            }
            
            echo "--- Building frontend ---"
            cd /var/www/tokeo-academy/frontend
            npm install
            npm run build

            echo "--- Starting/reloading frontend server ---"
            pm2 describe tokeo-frontend > /dev/null 2>&1 && pm2 reload tokeo-frontend --update-env || pm2 start server.js --name tokeo-frontend
            pm2 save

            echo "--- Deployment complete ---"